<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRON LOG</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3784660195076684"
     crossorigin="anonymous"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111217;
    --surface:#1B1D24;
    --surface-2:#242730;
    --surface-3:#2E313C;
    --accent:#FF5A36;
    --accent-dim:#4A2A20;
    --accent-2:#FFC93D;
    --text:#F2F1EC;
    --text-dim:#8B90A0;
    --line:#33363F;
    --danger:#FF5A5A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ad-clearance: 84px;
  }
  /* ---------- Theme: Light ---------- */
  #phone[data-theme="light"]{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-2:#F0F2F5;
    --surface-3:#E5E8ED;
    --accent:#E0472B;
    --accent-dim:#FBD9CF;
    --accent-2:#B36A00;
    --text:#0A0C10;
    --text-dim:#38404B;
    --line:#D7DAE1;
  }
  #phone[data-theme="light"] .primary-btn,
  #phone[data-theme="light"] #fab,
  #phone[data-theme="light"] .toast,
  #phone[data-theme="light"] .save-mini,
  #phone[data-theme="light"] .timer-ctrl-btn.start,
  #phone[data-theme="light"] #session-bar .count{ color:#FFFFFF; }
  #phone[data-theme="light"] .kp-key.confirm{ color:#FFFFFF; }
  #phone[data-theme="light"] #app-header .tagline{ color:var(--accent); }
  #phone[data-theme="light"] .cal-cell{ border:1px solid var(--line); }
  #phone[data-theme="light"] .cal-cell.today{
    border-width:2px; border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 85%, black);
  }
  #phone[data-theme="light"] .set-row, #phone[data-theme="light"] .recent-item,
  #phone[data-theme="light"] .ex-tile, #phone[data-theme="light"] .day-ex-block,
  #phone[data-theme="light"] .input-box{ border-color:var(--line); }
  #phone[data-theme="light"] .tile .ic,
  #phone[data-theme="light"] .ex-tile .ic,
  #phone[data-theme="light"] .ex-hero .ic,
  #phone[data-theme="light"] .day-ex-block .ic,
  #phone[data-theme="light"] .recent-item .ic{ color:#000000; }
  #phone[data-theme="light"] .recent-item .name{ color:#000000; }
  #phone[data-theme="light"] .cal-cell:not(.today) .d{ color:#000000; }
  #phone[data-theme="light"] #theme-sheet h2,
  #phone[data-theme="light"] .theme-opt .info .t-name{ color:#000000; }
  #phone[data-theme="light"] .tile .label,
  #phone[data-theme="light"] .ex-tile .name,
  #phone[data-theme="light"] .ex-hero .name,
  #phone[data-theme="light"] .day-ex-block .name{ color:#000000; }
  #phone[data-theme="light"] .day-set-row .tap-val{ color:#000000; }
  #phone[data-theme="light"] .drag-ghost{ color:#000000; }
  #phone[data-theme="light"] .quiz-entry .txt .title{ color:#000000; }
  #phone[data-theme="light"] .equip-opt.selected{
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface-2));
  }
  #phone[data-theme="light"] .equip-opt.selected .label{ color: var(--accent-2); }

  /* ---------- Theme: Colorful ---------- */
  #phone[data-theme="colorful"]{
    --bg:#EAF6FF;
    --surface:#FFFFFF;
    --surface-2:#F2F8FF;
    --surface-3:#E3F1FF;
    --accent:#FF6B4A;
    --accent-dim:#FFD9CC;
    --accent-2:#B36A00;
    --text:#0B141D;
    --text-dim:#33404C;
    --line:#BFE0F7;
  }
  #phone[data-theme="colorful"] .primary-btn,
  #phone[data-theme="colorful"] #fab,
  #phone[data-theme="colorful"] .toast,
  #phone[data-theme="colorful"] .save-mini,
  #phone[data-theme="colorful"] .timer-ctrl-btn.start,
  #phone[data-theme="colorful"] .kp-key.confirm{ color:#20140E; }
  #phone[data-theme="colorful"] h1, #phone[data-theme="colorful"] .month-label,
  #phone[data-theme="colorful"] .subview-title{ letter-spacing:0.02em; }
  #phone[data-theme="colorful"] #app-header .tagline{
    color:#20140E; background:var(--accent);
    padding:5px 10px; border-radius:10px; font-weight:800;
    box-shadow:0 3px 10px rgba(255,107,74,0.4);
  }
  /* body-part color coding: --part-color is set inline per screen/tile by JS.
     It is used only for icons/borders/tinted backgrounds — never for text —
     since several body-part colors (e.g. arms yellow, aerobic cyan) are far
     too light to read as text on a bright background. */
  #view{ --part-color: var(--accent); }
  #phone[data-theme="colorful"] .tile{
    border-width:2px;
    border-color: var(--part-color);
    background: color-mix(in srgb, var(--part-color) 14%, var(--surface));
  }
  #phone[data-theme="colorful"] .tile .ic{ color: color-mix(in srgb, var(--part-color) 75%, black); }
  #phone[data-theme="colorful"] .tile .label{ color: var(--text); font-weight:800; }
  /* Generic equipment/sound pickers (add-exercise modal, timer sound picker) aren't
     tied to a body part, so their icons should just be plain black — not tinted —
     and the selected state needs to stay visible over the black-forced label color above. */
  #phone[data-theme="colorful"] .equip-opt .ic{ color:#000000; }
  #phone[data-theme="colorful"] .equip-opt.selected{
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 20%, var(--surface-2));
  }
  #phone[data-theme="colorful"] .equip-opt.selected .label{ color: var(--accent-2); }
  #phone[data-theme="colorful"] .ex-tile{
    border-width:2px;
    border-color: var(--part-color);
  }
  #phone[data-theme="colorful"] .ex-tile .ic-wrap{
    background: color-mix(in srgb, var(--part-color) 24%, var(--surface-2));
    border-color: var(--part-color);
  }
  #phone[data-theme="colorful"] .ex-tile .ic{ color:#000000; }
  #phone[data-theme="colorful"] .ex-tile .name{ color:#000000; }
  #phone[data-theme="colorful"] .ex-hero{
    border-width:2px; border-color: var(--part-color);
    background: linear-gradient(135deg, color-mix(in srgb, var(--part-color) 24%, var(--surface-2)), var(--surface));
  }
  #phone[data-theme="colorful"] .ex-hero .ic-wrap{ background: color-mix(in srgb, var(--part-color) 34%, var(--surface-3)); }
  #phone[data-theme="colorful"] .ex-hero .ic{ color:#000000; }
  #phone[data-theme="colorful"] .ex-hero .name{ color:#000000; }
  #phone[data-theme="colorful"] .ex-hero .part{ color: var(--text-dim); font-weight:700; }
  #phone[data-theme="colorful"] .day-ex-block{ border-width:2px; border-color: var(--part-color); }
  #phone[data-theme="colorful"] .day-ex-block .ic-wrap{ background: color-mix(in srgb, var(--part-color) 26%, var(--surface-3)); }
  #phone[data-theme="colorful"] .day-ex-block .ic{ color:#000000; }
  #phone[data-theme="colorful"] .day-ex-block .name{ color:#000000; }
  #phone[data-theme="colorful"] .day-set-row .tap-val{ color:#000000; }
  #phone[data-theme="colorful"] .drag-ghost{ color:#000000; }
  #phone[data-theme="colorful"] .quiz-entry .txt .title{ color:#000000; }
  #phone[data-theme="colorful"] .primary-btn{ background: color-mix(in srgb, var(--part-color) 85%, black); }
  #phone[data-theme="colorful"] .cal-cell.has-log{ background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  #phone[data-theme="colorful"] .cal-cell.has-log .plate-dot{ background: var(--accent); }
  #phone[data-theme="colorful"] .cal-cell{ border:1px solid var(--line); }
  #phone[data-theme="colorful"] .cal-cell.today{
    border-width:2px; border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 85%, black);
  }
  #phone[data-theme="colorful"] .recent-item .ic{ color:#000000; }
  #phone[data-theme="colorful"] .recent-item .name{ color:#000000; }
  #phone[data-theme="colorful"] .cal-cell:not(.today) .d{ color:#000000; }
  #phone[data-theme="colorful"] #theme-sheet h2,
  #phone[data-theme="colorful"] .theme-opt .info .t-name{ color:#000000; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#0A0A0D;height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  #phone{
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,90,54,0.07), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(255,201,61,0.05), transparent 45%);
  }
  .display-font{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'DM Mono',monospace;}

  /* ---------- Header ---------- */
  #app-header{
    padding: calc(18px + var(--safe-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  #app-header .title-block{display:flex; align-items:center; gap:8px;}
  #app-header h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px; margin:0; letter-spacing:0.04em; line-height:1;
    color:var(--text);
  }
  #phone[data-theme="light"] #app-header h1,
  #phone[data-theme="colorful"] #app-header h1{
    -webkit-text-stroke:0.4px var(--text);
  }
  #app-header .plate-mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  #app-header .tagline{
    font-family:'Bebas Neue',sans-serif;
    font-size:12.5px; line-height:1.15; text-align:center;
    letter-spacing:0.08em; font-weight:700; color:var(--accent);
    white-space:nowrap; flex-shrink:0;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--text); cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-3);}
  #timer-btn{ background:#C99A2E; border-color:#C99A2E; color:#241A05; flex-shrink:0; }
  #timer-btn:active{ background:#B58A26; }

  /* ---------- Scroll body ---------- */
  #view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding: 0 20px calc(24px + var(--safe-bottom) + var(--ad-clearance));
  }
  #view::-webkit-scrollbar{width:0px;}

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;}
  .cal-nav .month-label{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.03em; color:var(--text);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--text); font-weight:700; padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1/1;
    border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    background:var(--surface);
    border:1px solid transparent;
    cursor:pointer;
  }
  .cal-cell.empty{background:transparent; cursor:default;}
  .cal-cell .d{font-size:14px; font-weight:600; color:var(--text-dim);}
  .cal-cell.has-log .d{color:var(--text);}
  .cal-cell.today{
    border-width:2px; border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 85%, black);
    box-shadow:0 4px 14px rgba(0,0,0,0.28);
  }
  .cal-cell.today .d{color:#FFFFFF; font-weight:800;}
  .cal-cell.today .plates .plate-dot{background:#FFFFFF;}
  .cal-cell .plates{position:absolute; bottom:6px; display:flex; gap:2px;}
  .cal-cell .plate-dot{width:5px;height:5px;border-radius:50%; background:var(--accent);}
  .cal-cell:active{background:var(--surface-2);}

  .empty-hint{
    margin-top:28px; padding:22px 18px; border-radius:18px;
    background:var(--surface); border:1px dashed var(--line);
    color:var(--text-dim); font-size:13.5px; line-height:1.7; text-align:center;
  }
  .app-footer-nav{
    margin-top:32px; padding-top:18px; border-top:1px solid var(--line);
    text-align:center; font-size:11.5px; color:var(--text-dim);
  }
  .app-footer-nav a{color:var(--text-dim); text-decoration:none; margin:0 2px;}
  .app-footer-nav a:active{color:var(--accent-2);}
  .app-footer-nav span{margin:0 4px; opacity:0.5;}
  .section-label{
    font-size:12px; color:var(--text-dim); font-weight:700; letter-spacing:0.08em;
    margin: 26px 2px 10px; text-transform:uppercase;
  }
  .recent-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border-radius:16px; padding:12px 14px; margin-bottom:8px;
    border:1px solid var(--line);
  }
  .recent-item .ic{width:36px;height:36px;flex-shrink:0;}
  .recent-item .info{flex:1; min-width:0;}
  .recent-item .date{font-size:11px; color:var(--text-dim); font-weight:600;}
  .recent-item .name{font-size:14.5px; font-weight:700; color:var(--text);}
  .recent-item .count{font-size:12px; color:var(--accent-2); font-weight:600; font-family:'DM Mono',monospace;}

  /* ---------- Grid tiles (body parts / exercises) ---------- */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .tile{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
  }
  .tile:active{background:var(--surface-2); transform:scale(0.98);}
  .tile .ic{width:44px;height:44px;}
  .tile .label{font-size:15px; font-weight:700; color:var(--text);}
  .tile .sub{font-size:11px; color:var(--text-dim);}

  .ex-tile{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer; margin-bottom:10px;
  }
  .ex-tile:active{background:var(--surface-2);}
  .ex-tile .ic-wrap{
    width:46px;height:46px;border-radius:12px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
    border:1px solid var(--line);
  }
  .ex-tile .ic{width:26px;height:26px;}
  .ex-tile .name{font-size:15px; font-weight:700; flex:1; color:var(--text);}
  .ex-tile .equip{font-size:10.5px; color:var(--text-dim); font-weight:600; letter-spacing:0.03em;}
  .ex-tile .chev{color:var(--text-dim);}
  .ex-custom-actions{display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .ex-action-btn{color:var(--text-dim); cursor:pointer; padding:6px;}
  .ex-action-btn.danger{color:var(--danger);}

  .quiz-entry{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--surface-2), var(--surface));
    border:1.5px dashed var(--accent); border-radius:18px;
    padding:16px; margin-bottom:18px; cursor:pointer;
  }
  .quiz-entry:active{background:var(--surface-2); transform:scale(0.99);}
  .quiz-entry .ic-wrap{
    width:46px;height:46px;border-radius:12px;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center; flex-shrink:0; color:var(--accent);
  }
  .quiz-entry .ic-wrap svg{width:24px;height:24px;}
  .quiz-entry .txt .title{font-size:15px; font-weight:800; color:var(--text);}
  .quiz-entry .txt .sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .quiz-entry .chev{margin-left:auto; color:var(--text-dim); flex-shrink:0;}
  .recording-date-banner{
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent-2);
    border-radius:14px; padding:10px 14px; font-size:12.5px; font-weight:700;
    margin-bottom:16px; text-align:center;
  }

  /* ---------- Back / top row for sub views ---------- */
  .subview-top{display:flex; align-items:center; gap:12px; margin:4px 0 4px;}
  .subview-top .crumb{font-size:12px; color:var(--text-dim); font-weight:600;}
  .subview-title{font-family:'Bebas Neue',sans-serif; font-size:26px; margin:6px 0 16px; letter-spacing:0.03em; color:var(--text);}

  /* ---------- Sets screen ---------- */
  .ex-hero{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--surface-2), var(--surface));
    border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:18px;
  }
  .ex-hero .ic-wrap{
    width:58px;height:58px;border-radius:16px;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .ex-hero .ic{width:32px;height:32px;}
  .ex-hero .name{font-size:19px; font-weight:800;}
  .ex-hero .part{font-size:12px; color:var(--accent-2); font-weight:600;}

  .set-row{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:8px;
  }
  .set-row .idx{
    width:26px;height:26px;border-radius:50%; background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0;
  }
  .set-row .vals{flex:1; display:flex; gap:6px; font-family:'DM Mono',monospace; font-size:15px; font-weight:500;}
  .set-row .vals b{color:var(--accent-2); font-weight:600;}
  .set-row .del{color:var(--text-dim); cursor:pointer; padding:4px;}

  .add-set-row{display:flex; gap:10px; margin:14px 0;}
  .input-box{
    flex:1; background:var(--surface); border:1.5px dashed var(--line); border-radius:14px;
    padding:14px 12px; cursor:pointer; text-align:center;
  }
  .input-box .lbl{font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:0.06em; text-transform:uppercase;}
  .input-box .val{font-family:'Bebas Neue',sans-serif; font-size:28px; margin-top:2px; color:var(--text);}
  .input-box.filled{border-style:solid; border-color:var(--accent);}
  .input-box.filled .val{color:var(--accent-2);}

  .primary-btn{
    width:100%; padding:16px; border-radius:16px; border:none;
    background:var(--accent); color:#1a0d08; font-weight:800; font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .primary-btn:active{background:#e04c2b;}
  .primary-btn:disabled{background:var(--surface-3); color:var(--text-dim);}
  .ghost-btn{
    width:100%; padding:15px; border-radius:16px; border:1px solid var(--line);
    background:transparent; color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
    margin-top:10px;
  }
  .ghost-btn:active{background:var(--surface-2);}

  /* ---------- Session floating bar ---------- */
  #session-bar{
    position:absolute; left:16px; right:16px; bottom:calc(16px + var(--safe-bottom) + var(--ad-clearance));
    background:var(--surface-3); border:1px solid var(--accent);
    border-radius:18px; padding:12px 16px;
    display:none; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    z-index:40;
  }
  #session-bar.show{display:flex;}
  #session-bar .left{display:flex; align-items:center; gap:10px; cursor:pointer;}
  #session-bar .count{
    width:30px;height:30px;border-radius:50%; background:var(--accent); color:#1a0d08;
    display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
  }
  #session-bar .txt{font-size:13px; font-weight:700;}
  #session-bar .save-mini{
    background:var(--accent-2); color:#1a0d08; border:none; border-radius:12px;
    padding:9px 16px; font-weight:800; font-size:13px; cursor:pointer;
  }

  /* ---------- FAB ---------- */
  #fab-group{
    position:absolute; right:18px; bottom:calc(18px + var(--safe-bottom) + var(--ad-clearance));
    display:flex; align-items:center; gap:10px; z-index:30;
  }
  #fab{
    width:58px;height:58px; border-radius:50%; flex-shrink:0;
    background:var(--accent); border:none; color:#1a0d08;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(255,90,54,0.4);
    cursor:pointer;
  }
  #fab:active{transform:scale(0.94);}
  #fab svg{width:26px;height:26px;}

  /* ---------- Keypad modal ---------- */
  #keypad-overlay, #addex-overlay, #theme-overlay, #timer-overlay, #ai-overlay, #memo-overlay, #finish-overlay{

</head>

<script>
(function(){

/* ============================= DATA ============================= */

const ICONS = {

  bodyweight: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">

  </svg>`,
  chest: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">

/* ============================= STORAGE (IndexedDB — GitHub Pages safe) =============================
   No server calls, no fetch, no window.storage. IndexedDB is used for all persistence —
   it's asynchronous natively (no main-thread blocking like localStorage), has a much higher
   storage ceiling, and can store plain JS objects/arrays directly without JSON.stringify.
   Object stores:
     - "logs"      keyPath 'date'  -> { date, entries }            one record per day's log
     - "dayTitles" keyPath 'date'  -> { date, title }               optional "何を鍛える？" note
     - "meta"      keyPath 'key'   -> { key, value }                theme / alarm sound / custom exercises
   A one-time migration copies over anyone's existing localStorage data (from the previous
   version of this app) into IndexedDB the first time this runs, so no one's history is lost.
============================================================================================= */

const IDB_NAME = 'iron-log-db';
const IDB_VERSION = 1;
let idbPromise = null;

function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unsupported')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('logs')) db.createObjectStore('logs', { keyPath:'date' });
      if(!db.objectStoreNames.contains('dayTitles')) db.createObjectStore('dayTitles', { keyPath:'date' });
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'key' });
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbPromise;
}
function idbGet(storeName, key){
  return openIDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbGetAllKeys(storeName){
  return openIDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAllKeys();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbPut(storeName, value){
  return openIDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  }));
}
function idbDelete(storeName, key){
  return openIDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  }));
}

async function loadIndex(){
  try{ return await idbGetAllKeys('logs'); }
  catch(e){ return []; }
}
// IndexedDB's own keys ARE the date index, so there's nothing separate to persist —
// kept as a no-op so every existing call site still works unchanged.
async function saveIndex(_dates){ return true; }

async function loadDayLog(date){
  try{ const rec = await idbGet('logs', date); return (rec && rec.entries) ? rec.entries : []; }
  catch(e){ return []; }
}
async function saveDayLog(date, data){
  try{ await idbPut('logs', { date, entries:data }); return true; }
  catch(e){ return false; }
}
async function deleteDayLog(date){
  try{ await idbDelete('logs', date); }catch(e){}
}
async function loadCustomExercises(){
  try{ const rec = await idbGet('meta', 'custom-exercises'); return rec ? rec.value : {}; }
  catch(e){ return {}; }
}
async function saveCustomExercises(obj){
  try{ await idbPut('meta', { key:'custom-exercises', value:obj }); return true; }
  catch(e){ return false; }
}
async function loadDayTitle(date){
  try{ const rec = await idbGet('dayTitles', date); return (rec && rec.title) ? rec.title : ''; }
  catch(e){ return ''; }
}
async function saveDayTitle(date, text){
  try{
    if(text) await idbPut('dayTitles', { date, title:text });
    else await idbDelete('dayTitles', date);
    return true;
  }catch(e){ return false; }
}

/**
 * One-time migration: copies any data from the previous localStorage-based version of
 * this app into IndexedDB, then marks itself done so it never re-runs. Safe to call even
 * if there's nothing to migrate (a brand-new install), and never deletes the old
 * localStorage keys — they're just left in place, unused, as a safety net.
 */
async function migrateFromLocalStorageIfNeeded(){
  try{
    const already = await idbGet('meta', 'migrated-from-localstorage');
    if(already && already.value) return;

    const oldIndexRaw = localStorage.getItem('log-index');
    if(oldIndexRaw){
      const dates = JSON.parse(oldIndexRaw);
      for(const d of dates){
        const raw = localStorage.getItem('log-'+d);
        if(raw){
          try{ await idbPut('logs', { date:d, entries: JSON.parse(raw) }); }catch(e){}
        }
      }
    }
    const ceRaw = localStorage.getItem('custom-exercises');
    if(ceRaw){ try{ await idbPut('meta', { key:'custom-exercises', value: JSON.parse(ceRaw) }); }catch(e){} }

    const themeRaw = localStorage.getItem('theme');
    if(themeRaw){ await idbPut('meta', { key:'theme', value: themeRaw }); }

    const soundRaw = localStorage.getItem('alarm-sound');
    if(soundRaw){ await idbPut('meta', { key:'alarm-sound', value: soundRaw }); }

    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('day-title-')===0){
        const date = k.slice('day-title-'.length);
        const title = localStorage.getItem(k);
        if(title){ try{ await idbPut('dayTitles', { date, title }); }catch(e){} }
      }
    }

    await idbPut('meta', { key:'migrated-from-localstorage', value:true });
  }catch(e){
    // IndexedDB unavailable or migration failed — the app still works, just starting fresh in IDB.
    console.error('localStorage → IndexedDB migration skipped:', e);
  }
}

async function refreshIndexAndRecents(){
  const dates = await loadIndex();
  state.logDates = new Set(dates);
}

function renderCalendar(){
  document.getElementById('fab-group').style.display = 'flex';
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayStr();

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const has = state.logDates.has(dstr);
    const isToday = dstr === today;
    cells += `<div class="cal-cell ${has?'has-log':''} ${isToday?'today':''}" data-date="${dstr}">
      <div class="d">${d}</div>
      ${has?'<div class="plates"><div class="plate-dot"></div></div>':''}
    </div>`;
  }

  let recentHtml = '';
  if(!state.loading && state.logDates.size === 0){
    recentHtml = `<div class="empty-hint">まだ記録がありません。<br>右下の「＋」から今日のトレーニングを<br>記録しましょう。</div>`;
  }

  $view.innerHTML = `
    <div class="cal-nav">
      <div class="icon-btn" id="prev-month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="month-label">${y}年 ${MONTH_NAMES[m]}</div>
      <div class="icon-btn" id="next-month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${recentHtml}
    <div class="app-footer-nav">
      <a href="guide.html">使い方</a>
      <span>・</span>
      <a href="about.html">サイトについて</a>
      <span>・</span>
      <a href="privacy.html">プライバシー</a>
      <span>・</span>
      <a href="contact.html">お問い合わせ</a>
    </div>
  `;

  document.getElementById('prev-month').onclick = ()=>{
    state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;}
    render();
  };
  document.getElementById('next-month').onclick = ()=>{
    state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;}
    render();
  };
  $view.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
    el.onclick = ()=>openDayDetail(el.dataset.date);
  });
}

let pendingSet = {};
let pendingMemo = '';

function setValueChips(fields, s){
  if(fields.length===2 && fields[0].key==='weight' && fields[1].key==='reps'){
    return `<span>${s.weight}kg × ${s.reps}reps</span>`;
  }
  return fields.map(f => `<span>${s[f.key]}${f.unit?f.unit:''}</span>`).join('');
}

function renderCurrentSetRowHtml(fields, s, si){
  const isStrength = fields.length===2 && fields[0].key==='weight' && fields[1].key==='reps';
  let valsHtml;
  if(isStrength){
    valsHtml = `<span class="tap-val" data-si="${si}" data-field="weight">${s.weight}kg</span><span class="x-sep">×</span><span class="tap-val" data-si="${si}" data-field="reps">${s.reps}reps</span>`;
  } else {
    valsHtml = fields.map(f=>`<span class="tap-val" data-si="${si}" data-field="${f.key}">${s[f.key]}${f.unit}</span>`).join('');
  }
  const memoHtml = `<span class="memo-tag ${s.memo?'has-memo':''}" data-si="${si}">${s.memo?'メモあり':'+メモ'}</span>`;
  return `
    <div class="day-set-row">
      <div class="idx">${si+1}</div>
      <div class="vals">${valsHtml}${memoHtml}</div>
      <div class="del-set" data-si="${si}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>
  `;
}

function renderSets(){
  document.getElementById('fab-group').style.display = 'none';
  const bp = state.bodyPart, ex = state.exercise;
  const fields = getExerciseFields(ex);
  $view.style.setProperty('--part-color', bp.color || 'var(--accent)');

  const setsHtml = state.currentSets.map((s,i)=>renderCurrentSetRowHtml(fields, s, i)).join('');

  const allFilled = fields.every(f => pendingSet[f.key]!==null && pendingSet[f.key]!==undefined);

  $view.innerHTML = `
    <div class="subview-top">
      <div class="icon-btn" id="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="crumb">${bp.label}</div>
    </div>
    <div class="ex-hero">
      <div class="ic-wrap">${icon(ex.equip,'ic')}</div>
      <div>
        <div class="name">${ex.name}</div>
        <div class="part">${ex.equipLabel}</div>
      </div>
    </div>

    ${setsHtml ? `<div class="section-label">記録した内容（タップで修正）</div>${setsHtml}` : ''}

    <div class="add-set-row">
      ${fields.map(f => `
        <div class="input-box ${pendingSet[f.key]!==null && pendingSet[f.key]!==undefined ?'filled':''}" data-field="${f.key}">
          <div class="lbl">${f.label}${f.unit?' ('+f.unit+')':''}</div>
          <div class="val">${pendingSet[f.key]!==null && pendingSet[f.key]!==undefined ? pendingSet[f.key] : '―'}</div>
        </div>
      `).join('')}
    </div>
    <div class="field-label">メモ（任意）</div>
    <input type="text" class="memo-input" id="pending-memo-input" placeholder="フォームの気づき、体調など" value="${pendingMemo.replace(/"/g,'&quot;')}">
    <button class="primary-btn" id="add-set-btn" ${allFilled?'':'disabled'}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      この記録を追加
    </button>
    <button class="ghost-btn" id="finish-ex-btn" ${state.currentSets.length===0?'disabled':''}>
      この種目を記録に追加 (${state.currentSets.length}件)
    </button>
  `;

  document.getElementById('back-btn').onclick = ()=>{ state.view='exercise'; state.currentSets=[]; pendingSet={}; pendingMemo=''; render(); };

  $view.querySelectorAll('.input-box[data-field]').forEach(box=>{
    const f = fields.find(ff=>ff.key===box.dataset.field);
    box.onclick = ()=>openKeypad({
      label: f.label+'を入力', unit: f.unit, decimal: f.decimal, initial: pendingSet[f.key],
      onConfirm:(v)=>{ pendingSet[f.key] = v; render(); }
    });
  });

  document.getElementById('pending-memo-input').oninput = (e)=>{ pendingMemo = e.target.value; };

  const addBtn = document.getElementById('add-set-btn');
  if(addBtn){
    addBtn.onclick = ()=>{
      if(!fields.every(f => pendingSet[f.key]!==null && pendingSet[f.key]!==undefined)) return;
      const newSet = {};
      fields.forEach(f => newSet[f.key] = pendingSet[f.key]);
      if(pendingMemo.trim()) newSet.memo = pendingMemo.trim();
      state.currentSets.push(newSet);
      pendingSet = {};
      pendingMemo = '';
      render();
    };
  }
  $view.querySelectorAll('.day-set-row .tap-val[data-si]').forEach(el=>{
    el.onclick = ()=>{
      const si = Number(el.dataset.si), fieldKey = el.dataset.field;
      const f = fields.find(ff=>ff.key===fieldKey);
      openKeypad({
        label: f.label+'を編集', unit: f.unit, decimal: f.decimal, initial: state.currentSets[si][fieldKey],
        onConfirm:(v)=>{ state.currentSets[si][fieldKey] = v; render(); }
      });
    };
  });
  $view.querySelectorAll('.memo-tag[data-si]').forEach(el=>{
    el.onclick = ()=>{
      const si = Number(el.dataset.si);
      openMemoModal(state.currentSets[si].memo || '', (val)=>{
        if(val) state.currentSets[si].memo = val; else delete state.currentSets[si].memo;
        render();
      });
    };
  });
  $view.querySelectorAll('.day-set-row .del-set[data-si]').forEach(el=>{
    el.onclick = ()=>{ state.currentSets.splice(Number(el.dataset.si),1); render(); };
  });

  const finishBtn = document.getElementById('finish-ex-btn');
  if(finishBtn){
    finishBtn.onclick = ()=>{
      if(!state.currentSets.length) return;
      state.session.push({
        bodyPartId: bp.id, bodyPartLabel: bp.label,
        exerciseId: ex.id, name: ex.name, equip: ex.equip, equipLabel: ex.equipLabel,
        fields: fields,
        sets: state.currentSets.slice(),
      });
      state.currentSets = [];
      pendingSet = {};
      pendingMemo = '';
      state.view = 'bodypart';
      render();
      showToast(ex.name + ' を追加しました');
    };
  }
}

const $kpOverlay = document.getElementById('keypad-overlay');
const $kpSheet = document.getElementById('keypad-sheet');
let kpState = null;

function openKeypad({label, unit, decimal, initial, onConfirm, allowZero}){
  kpState = { value: initial!==null && initial!==undefined ? String(initial) : '', decimal, onConfirm, unit, allowZero: !!allowZero };
  renderKeypad(label, unit);
  $kpOverlay.classList.add('show');
}
function closeKeypad(){
  $kpOverlay.classList.remove('show');
  kpState = null;
}

function renderKeypad(label, unit){
  const QUICKS = {
    'kg':[10,20,30,40,50,60], 'reps':[5,8,10,12,15,20], 'min':[5,10,15,20,30,45],
    'km/h':[4,5,6,7,8,10], '%':[0,1,2,3,5,8], 'rpm':[60,70,80,90,100,110], '':[1,2,3,4,5,6,7,8],
  };
  const quick = QUICKS[unit] || [5,8,10,12,15,20];
  $kpSheet.innerHTML = `
    <div class="kp-label">${label}</div>
    <div class="kp-display"><span id="kp-val">${kpState.value || '0'}</span><span class="unit">${unit}</span></div>
    <div class="quick-vals">
      ${quick.map(q=>`<div class="qv" data-q="${q}">${q}</div>`).join('')}
    </div>
    <div class="kp-grid">
      <div class="kp-key" data-k="1">1</div><div class="kp-key" data-k="2">2</div><div class="kp-key" data-k="3">3</div>
      <div class="kp-key" data-k="4">4</div><div class="kp-key" data-k="5">5</div><div class="kp-key" data-k="6">6</div>
      <div class="kp-key" data-k="7">7</div><div class="kp-key" data-k="8">8</div><div class="kp-key" data-k="9">9</div>
      <div class="kp-key func" data-k="${kpState.decimal?'.':'clear'}">${kpState.decimal?'.':'C'}</div>
      <div class="kp-key" data-k="0">0</div>
      <div class="kp-key func" data-k="back">⌫</div>
    </div>
    <button class="primary-btn" id="kp-confirm" style="margin-top:12px;">決定</button>
  `;
  $kpSheet.querySelectorAll('.kp-key[data-k]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.k;
      if(k==='back'){ kpState.value = kpState.value.slice(0,-1); }
      else if(k==='clear'){ kpState.value=''; }
      else if(k==='.'){ if(!kpState.value.includes('.')) kpState.value += (kpState.value===''?'0.':'.'); }
      else {
        if(kpState.decimal && kpState.value.includes('.')){
          const decimalPart = kpState.value.split('.')[1] || '';
          if(decimalPart.length >= 1) return; // already has 1 decimal digit — ignore further taps
        }
        if(kpState.value.length < 6) kpState.value += k;
      }
      document.getElementById('kp-val').textContent = kpState.value || '0';
    };
  });
  $kpSheet.querySelectorAll('.qv[data-q]').forEach(el=>{
    el.onclick = ()=>{ kpState.value = el.dataset.q; document.getElementById('kp-val').textContent = kpState.value; };
  });
  document.getElementById('kp-confirm').onclick = ()=>{
    const num = parseFloat(kpState.value);
    const invalid = isNaN(num) || num < 0 || (num === 0 && !kpState.allowZero);
    if(invalid){ showToast('数値を入力してください'); return; }
    const cb = kpState.onConfirm;
    closeKeypad();
    cb(num);
  };
}
$kpOverlay.addEventListener('click', (e)=>{ if(e.target===$kpOverlay) closeKeypad(); });

const $addexOverlay = document.getElementById('addex-overlay');
const $addexSheet = document.getElementById('addex-sheet');
const EQUIP_OPTIONS = [
  { equip:'barbell', label:'バーベル' },
  { equip:'dumbbell', label:'ダンベル' },
  { equip:'cable', label:'マシン・ケーブル' },
  { equip:'bodyweight', label:'自重' },
  { equip:'cardio', label:'有酸素' },
  { equip:'custom', label:'その他（自分で入力）' },
];
const CARDIO_FIELD_OPTIONS = [
  { key:'time', label:'時間', unit:'min', decimal:false },
  { key:'speed', label:'速度', unit:'km/h', decimal:true },
  { key:'incline', label:'傾斜・強度', unit:'%', decimal:true },
];

/**
 * Opens the add/edit-exercise sheet.
 * - Call with just `bp` to add a new custom exercise.
 * - Call with `bp, existingEx` to edit an existing user-added exercise in place.
 */
function openAddExerciseModal(bp, existingEx){
  if(FREEFORM_BODY_PARTS.includes(bp.id)){
    return openFreeformExerciseModal(bp, existingEx);
  }
  const isEdit = !!existingEx;
  let selectedEquip = existingEx
    ? { equip: existingEx.equip, label: existingEx.equip==='custom' ? existingEx.equipLabel : (EQUIP_OPTIONS.find(o=>o.equip===existingEx.equip)||{}).label }
    : null;
  let selectedCardioFields = new Set(
    existingEx && existingEx.equip==='cardio' && existingEx.fields
      ? existingEx.fields.map(f=>f.key)
      : []
  );

  $addexSheet.innerHTML = `
    <div class="handle"></div>
    <h2>${isEdit ? '種目を編集' : '種目を追加'}（${bp.label}）</h2>

        <div class="tile equip-opt ${selectedEquip && selectedEquip.equip===o.equip ? 'selected':''}" data-equip="${o.equip}" data-label="${o.label}" ${o.equip==='custom'?'style="grid-column:1 / -1;"':''}>
          ${icon(o.equip,'ic')}

        </div>
      `).join('')}
    </div>
    <div id="custom-equip-wrap" style="display:${selectedEquip && selectedEquip.equip==='custom' ? 'block':'none'};">
      <div class="field-label">器具タイプ名</div>
      <input type="text" id="custom-equip-name" class="text-input" placeholder="例：チューブ、EZバーなど" maxlength="14" value="${(existingEx && existingEx.equip==='custom' ? existingEx.equipLabel : '').replace(/"/g,'&quot;')}">
    </div>
    <div id="cardio-fields-wrap" style="display:${selectedEquip && selectedEquip.equip==='cardio' ? 'block':'none'};">

        ${CARDIO_FIELD_OPTIONS.map(f=>`
          <div class="tile equip-opt cardio-field-opt ${selectedCardioFields.has(f.key)?'selected':''}" data-field="${f.key}">
            <div class="label" style="font-size:13px; text-align:center;">${f.label}<br><span style="color:var(--text-dim); font-size:11px;">(${f.unit})</span></div>
          </div>
        `).join('')}
      </div>
    </div>
    <button class="primary-btn" id="confirm-add-ex" disabled>${isEdit ? '保存する' : 'この種目を追加'}</button>
  `;
  $addexOverlay.classList.add('show');

  const $nameInput = document.getElementById('new-ex-name');
  const $confirmBtn = document.getElementById('confirm-add-ex');
  const $customWrap = document.getElementById('custom-equip-wrap');
  const $customName = document.getElementById('custom-equip-name');
  const $cardioWrap = document.getElementById('cardio-fields-wrap');

  function checkReady(){
    const nameOk = $nameInput.value.trim().length > 0;
    let equipOk = !!selectedEquip;
    if(selectedEquip && selectedEquip.equip === 'custom'){
      equipOk = $customName.value.trim().length > 0;
    } else if(selectedEquip && selectedEquip.equip === 'cardio'){
      equipOk = selectedCardioFields.size > 0;
    }
    $confirmBtn.disabled = !(nameOk && equipOk);
  }
  $nameInput.addEventListener('input', checkReady);
  $customName.addEventListener('input', checkReady);

  $addexSheet.querySelectorAll('#equip-select .equip-opt').forEach(el=>{

      el.classList.add('selected');
      selectedEquip = { equip: el.dataset.equip, label: el.dataset.label };
      $customWrap.style.display = selectedEquip.equip === 'custom' ? 'block' : 'none';
      $cardioWrap.style.display = selectedEquip.equip === 'cardio' ? 'block' : 'none';
      checkReady();
    };
  });
  $addexSheet.querySelectorAll('.cardio-field-opt').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.field;
      if(selectedCardioFields.has(key)){ selectedCardioFields.delete(key); el.classList.remove('selected'); }
      else { selectedCardioFields.add(key); el.classList.add('selected'); }
      checkReady();
    };
  });

  $confirmBtn.onclick = async ()=>{
    const name = $nameInput.value.trim();

/* ============================= TIMER (STOPWATCH / ALARM) ============================= */

const $timerOverlay = document.getElementById('timer-overlay');
const $timerSheet = document.getElementById('timer-sheet');
const $alarmFlashOverlay = document.getElementById('alarm-flash-overlay');

const timerState = {
  minutes: 5,
  seconds: 0,
  remaining: 5 * 60,   // seconds left, counts down
  running: false,
  intervalId: null,
  soundId: 'beep',
  endAt: null,          // wall-clock timestamp (ms) the timer should finish at — the source of truth while running
  notifyPermission: (typeof Notification!=='undefined') ? Notification.permission : 'unsupported',
};

function formatMMSS(totalSeconds){
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* --- Alarm sounds: generated with the Web Audio API, no audio files needed --- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, startTime, type, gainVal){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainVal || 0.22, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}
const ALARM_SOUNDS = {
  beep:  { name:'ピピピ（短音）', play(){ const ctx=getAudioCtx(), now=ctx.currentTime;
    [0,0.28,0.56].forEach(t=>playTone(1300,0.16,now+t,'square',0.2)); } },
  airhorn: { name:'エアホーン', play(){
    // Use the real air-horn recording when it's available; fall back to the
    // synthesized version if the audio file is missing or fails to play.
    try{
      const audio = new Audio('sounds/airhorn.mp3');
      audio.volume = 1;
      const p = audio.play();
      if(p && p.catch) p.catch(()=>playSynthAirhorn());
    }catch(e){
      playSynthAirhorn();
    }
  } },
  chime: { name:'チャイム（メロディ）', play(){ const ctx=getAudioCtx(), now=ctx.currentTime;
    [[523,0],[659,0.2],[784,0.4],[1047,0.65]].forEach(([f,t])=>playTone(f,0.35,now+t,'sine',0.2)); } },
};
function playSynthAirhorn(){
  const now = getAudioCtx().currentTime;
  // Layered sawtooth/square chord per blast for a deep, brassy horn timbre;
  // two short blasts then one held much longer, like a classic airhorn cadence.
  const blast = (start, dur)=>{
    [131, 165, 196].forEach((f, i)=>{
      playTone(f, dur, start, i===0 ? 'sawtooth' : 'square', i===0 ? 0.3 : 0.15);
    });
  };
  blast(now, 0.6);
  blast(now + 0.68, 0.6);
  blast(now + 1.36, 1.6);
}
function unlockAirhornAudio(){
  const audio = new Audio('sounds/airhorn.mp3');
  audio.volume = 0;
  const p = audio.play();
  if(p && p.then){ p.then(()=>{ audio.pause(); audio.currentTime = 0; }).catch(()=>{}); }
}

async function loadAlarmSound(){
  try{ const rec = await idbGet('meta', 'alarm-sound'); return (rec && ALARM_SOUNDS[rec.value]) ? rec.value : 'beep'; }
  catch(e){ return 'beep'; }
}
async function saveAlarmSound(id){
  try{ await idbPut('meta', { key:'alarm-sound', value:id }); return true; }catch(e){ return false; }
}

/**
 * Recomputes remaining time from the wall-clock end timestamp rather than just
 * decrementing by 1 each tick. Plain setInterval ticks get throttled or paused
 * by the browser/OS once the tab or PWA is backgrounded, so counting "1 tick = 1
 * second" silently falls behind (or stops) while hidden. Anchoring to endAt means
 * that whenever a tick DOES fire — including the catch-up tick on visibilitychange
 * below — the displayed time and the finish check are both still accurate.
 */
function tickTimer(){
  if(!timerState.endAt){ return; }
  const msLeft = timerState.endAt - Date.now();
  if(msLeft <= 0){
    timerState.remaining = 0;
    stopTimer();
    triggerAlarmFinished();
    renderTimerModal();
    return;
  }
  timerState.remaining = Math.ceil(msLeft / 1000);
  renderTimerModal();
}

async function requestNotificationPermissionIfNeeded(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'default'){
    try{ timerState.notifyPermission = await Notification.requestPermission(); }
    catch(e){ /* ignore */ }
  } else {
    timerState.notifyPermission = Notification.permission;
  }
}

/**
 * Shows a system-level notification (banner + OS notification sound/vibration)
 * so the person is alerted even if this app is in the background or another app
 * is in the foreground — an in-page beep alone can't do that. Requires the person
 * to have granted notification permission; if not granted, this silently no-ops
 * and the person only gets the in-page sound/flash/vibrate when they return here.
 */
function fireSystemNotification(){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const options = {
    body: 'トレーニングのタイマーが終了しました',
    tag: 'iron-log-timer',
    icon: 'icons/icon-192.png',
    badge: 'icons/icon-192.png',
    vibrate: [300,120,300,120,300],
    requireInteraction: true,
  };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>{
        if(reg && reg.showNotification) reg.showNotification('⏰ タイマー終了', options);
        else new Notification('⏰ タイマー終了', options);
      }).catch(()=>{ try{ new Notification('⏰ タイマー終了', options); }catch(e){} });
    } else {
      new Notification('⏰ タイマー終了', options);
    }
  }catch(e){ console.error('notification failed', e); }
}

function triggerAlarmFinished(){
  const sound = ALARM_SOUNDS[timerState.soundId] || ALARM_SOUNDS.beep;
  try{ sound.play(); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]);
  $alarmFlashOverlay.classList.add('show');
  fireSystemNotification();
}
function dismissAlarmFlash(){
  $alarmFlashOverlay.classList.remove('show');
}

function startTimer(){
  if(timerState.running) return;
  // Unlock audio playback on the user gesture that starts the timer (required on iOS/Android).
  try{ getAudioCtx(); }catch(e){}
  try{ unlockAirhornAudio(); }catch(e){}
  requestNotificationPermissionIfNeeded();
  if(timerState.remaining <= 0){
    timerState.remaining = timerState.minutes * 60 + timerState.seconds;
  }
  timerState.endAt = Date.now() + timerState.remaining * 1000;
  timerState.running = true;
  timerState.intervalId = setInterval(tickTimer, 1000);
  renderTimerModal();
}
function stopTimer(){
  timerState.running = false;
  timerState.endAt = null;
  if(timerState.intervalId){ clearInterval(timerState.intervalId); timerState.intervalId = null; }
  renderTimerModal();
}
function restartTimer(){
  stopTimer();
  timerState.remaining = timerState.minutes * 60 + timerState.seconds;
  renderTimerModal();
}

// When the app regains focus/visibility, immediately recompute against the real
// clock — this is what makes the alarm actually fire (sound/flash/notification)
// even if background tick throttling meant no tick ran while it was hidden.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && timerState.running && timerState.endAt){
    tickTimer();
  }
});

function openTimerModal(){
  $timerOverlay.classList.add('show');
  renderTimerModal();
}
function closeTimerModal(){
  $timerOverlay.classList.remove('show');
}

function renderTimerModal(){
  $timerSheet.innerHTML = `
    <div class="handle"></div>
    <h2>タイマー</h2>
    <div class="timer-display ${timerState.running?'running':''}">${formatMMSS(Math.max(timerState.remaining,0))}</div>
    <div class="timer-set-row">
      <div class="input-box ${timerState.running?'disabled':''}" id="timer-min-box" style="${timerState.running?'pointer-events:none;opacity:0.5;':''}">
        <div class="lbl">分</div>
        <div class="val">${timerState.minutes}</div>
      </div>
      <div class="input-box ${timerState.running?'disabled':''}" id="timer-sec-box" style="${timerState.running?'pointer-events:none;opacity:0.5;':''}">
        <div class="lbl">秒</div>
        <div class="val">${timerState.seconds}</div>
      </div>
    </div>
    <div class="timer-controls">
      <div class="timer-ctrl-col">
        <div class="timer-ctrl-btn start ${timerState.running?'disabled':''}" id="timer-start-btn">${ICONS.play}</div>
        <div class="timer-ctrl-label">スタート</div>
      </div>
      <div class="timer-ctrl-col">
        <div class="timer-ctrl-btn ${!timerState.running?'disabled':''}" id="timer-stop-btn">${ICONS.pause}</div>
        <div class="timer-ctrl-label">ストップ</div>

function isAndroidDevice(){ return /Android/i.test(navigator.userAgent); }
function isIOSDevice(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent); }

/**
 * Opens the OS share sheet with text (and an image, when supported).
 * Works the same way on Android Chrome and iOS Safari/PWA — both surface
 * any installed AI app (Gemini, Copilot, Apple Intelligence-backed apps, etc.)
 * that has registered itself as a share target.
 */
async function shareToDevice(text, blob){
  if(!navigator.share){
    showToast('この端末・ブラウザは共有シートに対応していません');
    return false;
  }
  const shareData = { text };
  if(blob){
    const file = new File([blob], 'exercise-photo.jpg', { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      shareData.files = [file];
    }
  }
  try{
    await navigator.share(shareData);
    return true;
  }catch(err){
    if(err && err.name !== 'AbortError'){
      console.error('share failed', err);
      showToast('共有に失敗しました');
    }
    return false;
  }
}

/**
 * Android-only fallback: launch a specific AI app directly via an intent:// URL,
 * carrying the text as a standard ACTION_SEND extra. If the app isn't installed,
 * the browser_fallback_url takes the person to the web version instead.
 * NOTE: package names below are best-effort and may change as these apps update —
 * test on a real device and adjust the package id if the app doesn't open.
 */
function launchAndroidAiApp(appId, text){
  const encodedText = encodeURIComponent(text);
  const APPS = {
    gemini: {
      pkg: 'com.google.android.apps.bard',
      fallback: 'https://gemini.google.com/app',
    },
    copilot: {
      pkg: 'com.microsoft.copilot',
      fallback: 'https://copilot.microsoft.com',
    },
  };
  const app = APPS[appId];
  if(!app) return;
  const intentUrl = `intent:#Intent;action=android.intent.action.SEND;type=text/plain;`
    + `package=${app.pkg};S.android.intent.extra.TEXT=${encodedText};`
    + `S.browser_fallback_url=${encodeURIComponent(app.fallback)};end`;
  window.location.href = intentUrl;
}

async function saveSession(){
  if(!state.session.length) return;
  const date = state.recordingDate || todayStr();
  const existing = await loadDayLog(date);
  const merged = existing.concat(state.session);
  const ok = await saveDayLog(date, merged);
  if(ok){
    const dates = await loadIndex();
    if(!dates.includes(date)){ dates.push(date); await saveIndex(dates); }
    state.session = [];
    state.recordingDate = todayStr();
    state.view = 'calendar';
    await refreshIndexAndRecents();
    render();
    showToast(fmtDate(date) + ' に記録しました');
  } else {
    showToast('保存に失敗しました。もう一度お試しください');
  }
}

/* ============================= DRAG-TO-MERGE (combine duplicate same-day exercises) ============================= */

function sameExerciseForMerge(a, b){
  if(!a || !b || a===b) return false;
  if(a.name !== b.name) return false;
  const fa = (a.fields || DEFAULT_FIELDS).map(f=>f.key).join(',');
  const fb = (b.fields || DEFAULT_FIELDS).map(f=>f.key).join(',');
  return fa === fb;
}

async function mergeDayEntries(sourceIdx, targetIdx){
  const entries = state.dayDetailEntries;
  const source = entries[sourceIdx];
  const target = entries[targetIdx];
  if(!source || !target) return;
  target.sets = target.sets.concat(source.sets);
  entries.splice(sourceIdx, 1);
  await saveDayLog(state.dayDetailDate, entries);
  await refreshIndexAndRecents();
  renderDayDetail();
  renderCalendar();
  showToast(target.name + ' に結合しました');
}

/**
 * Long-press the grip handle on a day-ex-block, then drag onto another block with the
 * exact same exercise (same name + same record fields) to merge their sets into one.
 * Dragging onto a non-matching block, or releasing over empty space, cancels harmlessly.
 */
function setupMergeDragHandlers(){
  $daySheet.querySelectorAll('.drag-handle[data-i]').forEach(handle=>{
    let pressTimer = null;
    let dragging = false;
    let startX = 0, startY = 0;
    let ghost = null;
    let sourceIdx = null;
    let targetEl = null;

    function onMove(e){
      if(!dragging) return;
      e.preventDefault();
      if(ghost){
        ghost.style.left = (e.clientX - 50) + 'px';
        ghost.style.top = (e.clientY - 18) + 'px';
      }
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const block = el ? el.closest('.day-ex-block') : null;
      $daySheet.querySelectorAll('.day-ex-block.drop-target').forEach(b=>b.classList.remove('drop-target'));
      targetEl = null;
      if(block){
        const ti = Number(block.dataset.i);
        if(ti !== sourceIdx && sameExerciseForMerge(state.dayDetailEntries[sourceIdx], state.dayDetailEntries[ti])){
          block.classList.add('drop-target');
          targetEl = block;
        }
      }
    }

    function cleanup(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      if(ghost){ ghost.remove(); ghost = null; }
      $daySheet.querySelectorAll('.day-ex-block.dragging').forEach(b=>b.classList.remove('dragging'));
      $daySheet.querySelectorAll('.day-ex-block.drop-target').forEach(b=>b.classList.remove('drop-target'));
      dragging = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', cleanup);
    }

    async function onUp(){
      const doMerge = dragging && targetEl;
      const tIdx = targetEl ? Number(targetEl.dataset.i) : null;
      cleanup();
      if(doMerge) await mergeDayEntries(sourceIdx, tIdx);
    }

    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      sourceIdx = Number(handle.dataset.i);
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(()=>{
        dragging = true;
        const block = handle.closest('.day-ex-block');
        if(block) block.classList.add('dragging');
        const ent = state.dayDetailEntries[sourceIdx];
        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.textContent = ent ? ent.name : '';
        document.getElementById('phone').appendChild(ghost);
        ghost.style.left = (e.clientX - 50) + 'px';
        ghost.style.top = (e.clientY - 18) + 'px';
        document.addEventListener('pointermove', onMove, { passive:false });
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', cleanup);
      }, 350);
    });
    handle.addEventListener('pointermove', (e)=>{
      if(!dragging && pressTimer){
        if(Math.abs(e.clientX-startX) > 8 || Math.abs(e.clientY-startY) > 8){
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      }
    });
    handle.addEventListener('pointerup', ()=>{
      if(!dragging) cleanup();
    });
  });
}

/* ============================= WORKOUT FINISH: ASK AI OR REST ============================= */
/* This app has no server and no API key by design (it runs as a static site on GitHub
   Pages), so it can't call an AI model directly. Instead, tapping "はい" hands today's
   stats to a real AI app via the OS share sheet (the same mechanism as "AIに種目を聞く") —
   the instructional text is composed here and sent straight to the share sheet without
   ever being shown on screen first. */

const $finishOverlay = document.getElementById('finish-overlay');
const $finishSheet = document.getElementById('finish-sheet');

function computeStreakEndingAt(dateStr){
  let streak = 0;
  const cursor = new Date(dateStr + 'T00:00:00');
  while(true){
    const ds = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0') + '-' + String(cursor.getDate()).padStart(2,'0');
    if(state.logDates.has(ds)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

async function findTodaysPRs(dateStr, entries){
  const prs = [];
  const strengthEntries = entries.filter(ent=>{
    const f = ent.fields || DEFAULT_FIELDS;
    return f.length===2 && f[0].key==='weight' && f[1].key==='reps' && ent.sets.length;
  });
  if(!strengthEntries.length) return prs;

  // Cache each other day's log for the duration of this scan so repeated exercise
  // names in today's list don't re-fetch the same days from IndexedDB.
  const otherDates = [...state.logDates].filter(d=>d!==dateStr);
  const logsByDate = {};
  for(const d of otherDates){ logsByDate[d] = await loadDayLog(d); }

  for(const ent of strengthEntries){
    const todayMax = Math.max(...ent.sets.map(s=>s.weight||0));
    let historicalMax = 0;
    for(const d of otherDates){
      (logsByDate[d]||[]).forEach(e=>{
        if(e.name !== ent.name) return;
        const f = e.fields || DEFAULT_FIELDS;
        if(f.length===2 && f[0].key==='weight' && f[1].key==='reps'){
          e.sets.forEach(s=>{ if((s.weight||0) > historicalMax) historicalMax = s.weight; });
        }
      });
    }
    if(todayMax > historicalMax){ prs.push({ name: ent.name, weight: todayMax }); }
  }
  return prs;
}

async function computeWorkoutStats(dateStr, entries){
  const exCount = entries.length;
  const setCount = entries.reduce((sum,e)=>sum + e.sets.length, 0);
  const parts = [...new Set(entries.map(e=>e.bodyPartLabel).filter(Boolean))];
  let totalVolume = 0;
  entries.forEach(e=>{
    const f = e.fields || DEFAULT_FIELDS;
    if(f.length===2 && f[0].key==='weight' && f[1].key==='reps'){
      e.sets.forEach(s=>{ totalVolume += (s.weight||0) * (s.reps||0); });
    }
  });
  const streak = computeStreakEndingAt(dateStr);
  const prs = await findTodaysPRs(dateStr, entries);
  return { exCount, setCount, parts, totalVolume, streak, prs };
}

/** Plain factual description of today's training — no fake enthusiasm, just the data,
 *  since a real AI will supply the tone once it receives this. */
function statsToPromptText(dateStr, entries, stats){
  const lines = [];
  lines.push(`${fmtDate(dateStr)}のトレーニング記録です。`);
  lines.push(`部位：${stats.parts.length ? stats.parts.join('・') : '記載なし'}`);
  lines.push(`種目数：${stats.exCount}種目、セット数：${stats.setCount}セット`);
  entries.forEach(e=>{
    const f = e.fields || DEFAULT_FIELDS;
    const setsStr = e.sets.map(s=>{
      if(f.length===2 && f[0].key==='weight' && f[1].key==='reps') return `${s.weight}kg×${s.reps}reps`;
      return f.map(ff=>`${s[ff.key]}${ff.unit||''}`).join(' ');
    }).join('、');
    lines.push(`・${e.name}：${setsStr}`);
  });
  if(stats.totalVolume > 0) lines.push(`総ボリューム：約${Math.round(stats.totalVolume).toLocaleString()}kg`);
  if(stats.prs.length) lines.push(`自己ベスト更新：${stats.prs.map(p=>`${p.name} ${p.weight}kg`).join('、')}`);
  if(stats.streak >= 2) lines.push(`連続記録日数：${stats.streak}日`);
  return lines.join('\n');
}

function buildAiSharePrompt(dateStr, entries, stats){
  return statsToPromptText(dateStr, entries, stats)
    + '\n\n今日の内容を踏まえて、明日行うと良いトレーニングメニューを提案してください。';
}

function openFinishWorkoutGate(){
  $finishOverlay.classList.add('show');
  $finishSheet.innerHTML = `
    <div class="handle"></div>
    <h2>トレーニング終了</h2>
    <div class="finish-summary-card" style="text-align:center; font-weight:800; font-size:15.5px;">AIに今日の成果を見てもらいますか？</div>
    <div style="display:flex; gap:10px; margin-top:4px;">
      <button class="ghost-btn" id="finish-no-btn" style="flex:1; margin-top:0;">いいえ</button>
      <button class="primary-btn" id="finish-yes-btn" style="flex:1; margin-top:0;">はい</button>
    </div>
  `;
  document.getElementById('finish-no-btn').onclick = ()=>{
    $finishSheet.innerHTML = `
      <div class="handle"></div>
      <h2>お疲れさまでした</h2>
      <div class="finish-summary-card" style="text-align:center;">お疲れさまでした。<br>しっかり休んでください。</div>
      <button class="primary-btn" id="finish-rest-close-btn">閉じる</button>
    `;
    document.getElementById('finish-rest-close-btn').onclick = ()=>{ $finishOverlay.classList.remove('show'); };
  };
  document.getElementById('finish-yes-btn').onclick = async ()=>{
    $finishOverlay.classList.remove('show');
    const date = state.dayDetailDate;
    const entries = state.dayDetailEntries || [];
    const stats = await computeWorkoutStats(date, entries);
    const prompt = buildAiSharePrompt(date, entries, stats);
    if(typeof navigator.share === 'function'){
      await shareToDevice(prompt, null);
    } else {
      // No native share sheet on this device/browser — fall back to the in-app
      // AI-share screen (Android intent buttons, editable text) as a backup path.
      openAiShareModal(prompt);
    }
  };
}
$finishOverlay.addEventListener('click', (e)=>{ if(e.target===$finishOverlay) $finishOverlay.classList.remove('show'); });

/* ============================= MAIN RENDER SWITCH ============================= */

function render(){
  if(state.view==='calendar') renderCalendar();
  else if(state.view==='bodypart') renderBodyPartSelect();
  else if(state.view==='exercise') renderExerciseSelect();
  else if(state.view==='sets') renderSets();
  else if(state.view==='session') renderSessionReview();
  updateSessionBar();
}

document.getElementById('fab').onclick = ()=>{
  state.recordingDate = todayStr();
  state.bodyPart = null; state.exercise = null; state.currentSets = [];
  state.view = 'bodypart';
  render();
};
document.getElementById('today-btn').onclick = ()=>{
  state.calMonth = new Date().getMonth();
  state.calYear = new Date().getFullYear();
  state.view = 'calendar';
  render();
};
document.getElementById('session-save-btn').onclick = saveSession;
document.getElementById('session-bar-left').onclick = ()=>{
  if(!state.session.length) return;
  state.view = 'session';
  render();
};

/* ============================= INIT ============================= */

(async function init(){
  $view.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
  await migrateFromLocalStorageIfNeeded();
  const savedTheme = await loadTheme();
  applyTheme(savedTheme);
  timerState.soundId = await loadAlarmSound();
  state.customExercises = await loadCustomExercises();
  await refreshIndexAndRecents();
  state.loading = false;
  render();
})();

})();
